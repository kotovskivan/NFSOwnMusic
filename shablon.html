<!DOCTYPE html>
<html lang="{{!lang}}" class="{{!cls}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{!head}}
<link rel="icon" href="{{!rel}}favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0c10">
<style>
/* ЧЕРНОВОЙ ДИЗАЙН (13.11.2026) — Ваня: «прикинь просто, потом сделаем дизайн». Цвета статусов — переменные ниже. */
:root{--bg:#0b0c10;--panel:#14161c;--line:#232733;--text:#eef1f6;--muted:#8b93a4;
  --ready:#3dff8f;--soon:#ffd23f;--wait:#5b6272;--accent:#ff5a1f}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body{margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.head-f{font-family:Bahnschrift,"Arial Narrow","Segoe UI",system-ui,sans-serif;font-stretch:condensed}

/* шапка */
.top{position:sticky;top:0;z-index:5;background:rgba(11,12,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{text-decoration:none;font-weight:700;letter-spacing:.08em;font-size:15px}
.logo b{color:var(--accent)}
.langs{position:relative}
.langs summary{list-style:none;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--muted)}
.langs summary::-webkit-details-marker{display:none}
.langs[open] summary{color:var(--text);border-color:var(--muted)}
.langs nav{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px;min-width:210px;max-height:70vh;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.langs nav a{display:flex;gap:10px;padding:6px 10px;border-radius:5px;text-decoration:none;font-size:14px}
.langs nav a b{width:24px;color:var(--muted);font-weight:600}
.langs nav a:hover{background:var(--line)}
.langs nav a[aria-current]{background:var(--line)}
.langs nav .ai{margin:6px 10px 4px;font-size:12px;color:var(--muted)}

/* первый экран */
.hero{padding:72px 0 40px;border-bottom:1px solid var(--line);
  background:radial-gradient(900px 380px at 15% 0%,rgba(255,90,31,.16),transparent 70%)}
.kicker{margin:0 0 10px;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
h1{margin:0;font-size:clamp(44px,8vw,88px);line-height:.95;font-style:italic;font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.lead{margin:22px 0 8px;font-size:clamp(19px,2.4vw,24px);max-width:760px}
.sub{margin:0;color:var(--muted);max-width:700px}

/* серия */
.series{padding:44px 0 64px}
.sh{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h2{margin:0;font-size:30px;font-style:italic;font-weight:800}
.sh p{margin:0;color:var(--muted)}
.legend{display:flex;gap:22px;flex-wrap:wrap;list-style:none;padding:0;margin:16px 0 26px;color:var(--muted);font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;min-height:150px;
  display:flex;flex-direction:column;align-items:flex-start}
.card .yr{margin:0 0 6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card h3{margin:0 0 12px;font-size:21px;line-height:1.15;font-weight:700;font-style:italic}
.card h3 small{display:block;font-size:12px;font-weight:600;font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.card.ready{border-color:var(--ready);grid-column:span 2;background:linear-gradient(135deg,rgba(61,255,143,.10),var(--panel) 60%)}
.card.soon{border-color:var(--soon);grid-column:span 2;background:linear-gradient(135deg,rgba(255,210,63,.10),var(--panel) 60%)}
.card.wait h3{color:#c4c9d3}
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.b.ready{background:var(--ready);color:#06210f}
.b.soon{background:var(--soon);color:#2a2100}
.b.wait{background:transparent;color:var(--muted);border:1px solid var(--wait)}
.b.wait i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--wait);color:var(--text);font-size:11px}
.card.wait .b{margin-top:auto}
.prog{margin:14px 0 0;font-weight:600}
.prog small{color:var(--muted);font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:600;background:#1b1e26}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--text);color:var(--bg);border-color:var(--text)}

/* низ */
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13px}
footer p{margin:0 0 6px}

/* «есть на твоем языке» */
.suggest{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:6px;
  background:var(--text);color:var(--bg);border-radius:8px;padding:6px 6px 6px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px}
.suggest[hidden]{display:none}
.suggest a{font-weight:700}
.suggest button{border:0;background:transparent;font-size:18px;cursor:pointer;padding:0 8px;color:inherit}

.cjk h1,.cjk h2,.cjk .card h3{font-style:normal}
@media (max-width:560px){.card.ready,.card.soon{grid-column:auto}.hero{padding-top:44px}}
</style>
</head>
<body>
<div class="suggest" id="suggest" hidden><a id="suggest-a" href="./"></a><button type="button" id="suggest-x" aria-label="×">×</button></div>

<header class="top"><div class="wrap">
  <a class="logo head-f" href="{{!home}}">NFS <b>OWN MUSIC</b></a>
  <details class="langs">
    <summary aria-label="{{lang_nav|attr}}">{{!cur_label}}</summary>
    <nav>{{!langs}}<p class="ai">{{ai_note}}</p></nav>
  </details>
</div></header>

<main>
<section class="hero"><div class="wrap">
  <p class="kicker">{{kicker}}</p>
  <h1 class="head-f">NFS <span>Own Music</span></h1>
  <p class="lead">{{lead}}</p>
  <p class="sub">{{sub}}</p>
</div></section>

<section class="series" id="games"><div class="wrap">
  <div class="sh"><h2 class="head-f">{{series_h}}</h2><p>{{series_sub}}</p></div>
  <ul class="legend">
    <li><span class="b ready">{{st_ready}}</span>{{l_ready}}</li>
    <li><span class="b soon">{{st_soon}}</span>{{l_soon}}</li>
    <li><span class="b wait"><i aria-hidden="true">?</i>{{st_wait}}</span>{{l_wait}}</li>
  </ul>
  <div class="grid">
{{!games}}
  </div>
</div></section>
</main>

<footer><div class="wrap">
  <p>{{foot}}</p>
  <p>Kitivski + Claude · <a href="{{@github}}" target="_blank" rel="noopener">GitHub</a> · {{ai_note}}</p>
</div></footer>

<script>
(function () {
  var P = {{!pages_json}}, cur = "{{!code}}";
  try { if (localStorage.getItem("nom-suggest")) return; } catch (e) {}
  var ls = navigator.languages || [navigator.language || ""];
  for (var i = 0; i < ls.length; i++) {
    var c = String(ls[i] || "").toLowerCase().split("-")[0];
    if (c === "ua") c = "uk";
    if (c === cur) return;
    if (P[c]) {
      var s = document.getElementById("suggest"), a = document.getElementById("suggest-a");
      a.textContent = P[c].t; a.href = P[c].href; a.lang = c; s.hidden = false;
      document.getElementById("suggest-x").onclick = function () {
        s.hidden = true; try { localStorage.setItem("nom-suggest", "1"); } catch (e) {}
      };
      return;
    }
  }
})();
</script>
</body>
</html>
